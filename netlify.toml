# Netlify deployment for this TanStack Start (Nitro) project.
#
# TanStack Start with Nitro's `netlify` preset outputs:
#   .netlify/functions-internal/server  -> SSR serverless function
#   .netlify/static (or dist/public)    -> static client assets
#
# We leave `publish` unset so Netlify auto-detects the static output.
# Nitro generates its own _redirects that routes unmatched paths to
# the SSR function, handling /login, /admin, /dashboard, /products/* etc.

[build]
  command = "npm run build"

[build.environment]
  NITRO_PRESET = "netlify"
  NODE_VERSION = "20"